<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Commerce Store</title>
<link rel="stylesheet" href="./app.css">
</head>

<body>

<header>
  <h2 style="color: orange;"> E-Commerce Store 🛒</h2>
  <div class="cart" onclick="toggleCart()" style="color: orange;">
    🛒 Cart (<span id="cart-count">0</span>)
  </div>
</header>

<div class="products" id="products"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modal-title"></h3>
    <img id="modal-img" width="100">
    <p id="modal-desc"></p>
    <p><strong>$<span id="modal-price"></span></strong></p>
    <button onclick="addToCartFromModal()">Add to Cart</button>
  </div>
</div>

<!-- CART PANEL -->
<div class="cart-panel" id="cart-panel">
  <h3>Your Cart <button id="close-cart">X</button></h3>
  <div id="cart-items"></div>
  <h4>Total: $<span id="total"></span></h4>
</div>
<script src="./app.js"></script>

</body>
</html>
